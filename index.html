<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hordeless</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>
      
      <!-- Music -->
      <audio id="bg-music" src="/Assets/bobbeats-8-bit-loop-music-290770.mp3.mpeg" loop></audio>

      <!-- UI Overlays -->
      <div id="main-menu" class="ui-screen active">
        <h1 class="pixel-text">HORDELESS</h1>
        <div class="menu-buttons">
            <img src="/Assets/Free/Menu/Buttons/Play.png" id="btn-play" alt="Play" class="pixel-btn" />
            <img src="/Assets/Free/Menu/Buttons/Levels.png" id="btn-levels" alt="Levels" class="pixel-btn" />
            <img src="/Assets/Free/Menu/Buttons/Leaderboard.png" id="btn-leaderboard" alt="Leaderboard" class="pixel-btn" />
            <img src="/Assets/Free/Menu/Buttons/Achievements.png" id="btn-achievements" alt="Achievements" class="pixel-btn" />
            <img src="/Assets/Free/Menu/Buttons/Settings.png" id="btn-settings" alt="Settings" class="pixel-btn" />
        </div>
      </div>

      <div id="upgrade-menu" class="ui-screen">
        <h2>Skill Preparation</h2>
        <div class="stats-display">
          <span style="color: #4CAF50; font-size: 24px;">Skill Points: <span id="menu-sp">100</span> SP</span>
        </div>
        <div class="upgrade-list">
          <div class="upgrade-item">
            <span>Double Jump (20 SP)</span>
            <div class="upgrade-actions">
              <span id="lvl-djump">OFF</span>
              <button id="btn-upg-djump">Toggle</button>
            </div>
          </div>
          <div class="upgrade-item">
            <span>Wall Jump (20 SP)</span>
            <div class="upgrade-actions">
              <span id="lvl-wjump">OFF</span>
              <button id="btn-upg-wjump">Toggle</button>
            </div>
          </div>
          <div class="upgrade-item">
            <span>Swiftness [+Spd] (-20 SP/Lv)</span>
            <div class="upgrade-actions">
              <span id="lvl-speed">Lv 0</span>
              <button id="btn-upg-speed-add" class="small-btn">+</button>
              <button id="btn-upg-speed-sub" class="small-btn">-</button>
            </div>
          </div>
          <div class="upgrade-item">
            <span>Vitality [+HP] (-30 SP/Lv)</span>
            <div class="upgrade-actions">
              <span id="lvl-health">Lv 0</span>
              <button id="btn-upg-health-add" class="small-btn">+</button>
              <button id="btn-upg-health-sub" class="small-btn">-</button>
            </div>
          </div>
        </div>
        <button id="btn-start-run" class="action-btn">Enter Arena</button>
      </div>

      <div id="hud" class="ui-screen">
        <div class="hud-top">
          <div class="hud-stat">Health: <span id="hud-health">3</span></div>
          <div class="hud-stat">Score: <span id="hud-score">0</span></div>
          <div class="hud-stat">Coins: <span id="hud-coins">0</span></div>
        </div>
      </div>

      <div id="game-over" class="ui-screen">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="go-score">0</span></p>
        <p>Coins Collected: <span id="go-coins">0</span></p>
        <button id="btn-menu">Back to Menu</button>
      </div>
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
